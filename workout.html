<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout Tracker</title>
  <style>
    :root{--bg:#0f1720;--panel:#162331;--panel2:#1c2d3f;--text:#eef6ff;--muted:#9fb1c3;--accent:#7dd3fc;--danger:#fb7185;--ok:#86efac;--warn:#facc15;--border:rgba(255,255,255,.12)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b1118,#111c28);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} a{color:inherit;text-decoration:none} button,input,textarea,select{font:inherit}.wrap{max-width:1120px;margin:0 auto;padding:18px}.top{position:sticky;top:0;z-index:2;background:rgba(15,23,32,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.top .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{margin:0;font-size:26px}.sub{margin:4px 0 0;color:var(--muted);font-size:14px}.top-volume{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:14px;padding:10px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#0284c7,#0f766e);border:0}.btn.danger{background:rgba(251,113,133,.12);color:#fecdd3}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:16px;padding:12px}.tabs button.active{background:var(--accent);color:#06202b}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{background:rgba(22,35,49,.88);border:1px solid var(--border);border-radius:22px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{color:var(--muted);font-size:13px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;background:#0b141d;color:var(--text);padding:10px}textarea{min-height:72px}.exercise{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:18px;padding:14px;margin:12px 0}.exercise-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exercise h3{margin:0 0 4px}.note{color:var(--muted);font-size:13px;margin:0 0 10px}.sets{display:grid;gap:8px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:8px;align-items:center}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:13px}.history-item{border-bottom:1px solid var(--border);padding:12px 0}.history-item:last-child{border-bottom:0}.history-title{display:flex;justify-content:space-between;gap:10px}.small{font-size:13px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#06131d;color:white;border:1px solid var(--border);border-radius:999px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}.mini-chart{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}.chart-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}.trend{border-radius:999px;padding:3px 8px;border:1px solid var(--border);font-size:12px}.trend.good{color:var(--ok)}.trend.bad{color:var(--danger)}.trend.flat{color:var(--muted)}.trend.warn{color:var(--warn)}.spark{height:104px;display:flex;gap:8px;align-items:end;border:1px solid var(--border);border-radius:14px;padding:10px;overflow-x:auto;background:rgba(0,0,0,.14)}.bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px;min-width:34px;height:100%}.bar{width:18px;border-radius:8px 8px 2px 2px;background:var(--accent)}.bar.preview{background:var(--warn)}.bar-wrap small{font-size:10px;color:var(--muted);white-space:nowrap}.legend{font-size:11px;color:var(--muted);margin-top:6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top .wrap{display:block}.actions{margin-top:12px}.setrow{grid-template-columns:28px 1fr 1fr 36px}.exercise-head{display:block}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><div><h1 class="title">Workout Tracker</h1><p class="sub">Modulo separato: legge e salva solo le tabelle workout.</p><div class="top-volume"><span class="chip">Volume totale: <strong id="topVolume">0</strong></span></div></div><div class="actions"><a class="btn" href="./?v=80">Life Tracker</a><button class="btn" id="reloadBtn">Ricarica cloud</button><button class="btn primary" id="saveBtn">Salva</button></div></div></header>
  <main class="wrap">
    <div id="authBox" class="panel">Controllo accesso Supabase...</div>
    <div id="app" class="hidden">
      <div class="tabs"><button data-day="upper" class="active">Upper</button><button data-day="lower">Lower</button><button data-day="full">Archivio full</button></div>
      <div class="grid">
        <section>
          <div class="panel"><div class="row"><div class="field" style="min-width:210px;flex:1"><label>Data workout</label><input type="date" id="dateInput"></div><div class="field"><label>&nbsp;</label><button class="btn" id="calendarBtn">Calendario</button></div><div class="field"><label>&nbsp;</label><button class="btn primary" id="saveBtn2">Salva</button></div></div><p class="small" id="modeHint"></p></div>
          <div id="overallChart" class="panel"></div>
          <div id="exerciseList"></div>
        </section>
        <aside>
          <div class="panel"><h2>Riepilogo</h2><div id="summary"></div></div>
          <div class="panel"><h2>Storico</h2><div id="history"></div></div>
        </aside>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="vendor/supabase.js?v=21"></script>
  <script src="workout_app.js?v=4"></script>
</body>
</html>
