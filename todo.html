<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Todo Tracker</title>
  <style>
    :root{--bg:#0f1720;--panel:#162331;--panel2:#1c2d3f;--text:#eef6ff;--muted:#9fb1c3;--accent:#7dd3fc;--ok:#86efac;--danger:#fb7185;--warn:#facc15;--border:rgba(255,255,255,.12)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1118,#111c28);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.wrap{max-width:1120px;margin:0 auto;padding:18px}.top{position:sticky;top:0;z-index:3;background:rgba(15,23,32,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.top .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{margin:0;font-size:26px}.sub{margin:4px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:14px;padding:10px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#0284c7,#0f766e);border:0}.btn.danger{background:rgba(251,113,133,.12);color:#fecdd3}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.panel{background:rgba(22,35,49,.88);border:1px solid var(--border);border-radius:22px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{color:var(--muted);font-size:13px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:#0b141d;color:var(--text);padding:10px}textarea{min-height:72px}.todo{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:18px;padding:12px;margin:10px 0;cursor:grab;transition:opacity .15s,transform .15s,border-color .15s,background .15s}.todo:active{cursor:grabbing}.todo.done{opacity:.62}.todo.dragging{opacity:.45;transform:scale(.98);border-color:var(--accent)}.todo-title{display:flex;gap:10px;align-items:flex-start}.todo-title input{width:auto;margin-top:4px}.todo-title strong{line-height:1.35}.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--border);border-radius:9px;color:var(--muted);background:rgba(255,255,255,.04);flex:0 0 auto;cursor:grab;user-select:none}.small{font-size:13px;color:var(--muted)}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.drop-list{min-height:72px;border:1px dashed transparent;border-radius:18px;padding:2px;transition:border-color .15s,background .15s}.drop-list.drop-over{border-color:var(--accent);background:rgba(125,211,252,.08)}.empty-drop{border:1px dashed var(--border);border-radius:16px;padding:14px;text-align:center}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#06131d;color:white;border:1px solid var(--border);border-radius:999px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.top .wrap{display:block}.actions{margin-top:12px}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><div><h1 class="title">Todo Tracker</h1><p class="sub">App separata: usa solo la tabella indipendente todo_standalone_items.</p></div><div class="actions"><a class="btn" href="./?v=80">Life Tracker</a><button class="btn" id="reloadBtn">Ricarica cloud</button></div></div></header>
  <main class="wrap">
    <div id="authBox" class="panel">Controllo accesso Supabase...</div>
    <div id="app" class="hidden">
      <section class="panel"><h2>Nuovo task</h2><div class="row"><div class="field" style="flex:2;min-width:240px"><label>Titolo</label><input id="taskTitle" placeholder="Cosa devi fare?"></div><div class="field" style="flex:1;min-width:140px"><label>Lista</label><select id="taskList"><option value="today">Oggi</option><option value="urgent">Urgente</option><option value="later">Più avanti</option></select></div><div class="field" style="flex:1;min-width:140px"><label>Scadenza</label><input type="date" id="taskDue"></div><div class="field"><label>&nbsp;</label><button class="btn primary" id="addBtn">Aggiungi</button></div></div><div class="field"><label>Nota</label><input id="taskNote" placeholder="Nota opzionale"></div><p class="small">I task sono migrati dalla vecchia tabella, ma da ora questa app lavora sulla tabella indipendente.</p></section>
      <section class="panel"><h2>Riepilogo</h2><div class="row" id="summary"></div></section>
      <div class="grid"><section class="panel"><h2>Oggi</h2><div id="todayList"></div></section><section class="panel"><h2>Urgente</h2><div id="urgentList"></div></section><section class="panel"><h2>Più avanti</h2><div id="laterList"></div></section></div>
      <section class="panel"><h2>Completati</h2><div id="doneList"></div></section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="vendor/supabase.js?v=21"></script>
  <script src="todo_app.js?v=2"></script>
</body>
</html>
