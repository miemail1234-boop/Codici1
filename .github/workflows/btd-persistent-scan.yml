name: BTD Persistent Scan

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btd-persistent-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://kujyowhezihjambhpahe.supabase.co/functions/v1
      ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1anlvd2hlemloamFtYmhwYWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTc0ODEsImV4cCI6MjA5NDc5MzQ4MX0.eIUDonerpv0KFSfrbronkfgPBBwy7xWsK4YGaTXxTlY'
    steps:
      - name: Refresh economic cycle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --max-time 170 \
            --request POST "$BASE/btd-economic-cycle" \
            --header "Authorization: Bearer $ANON" \
            --header "apikey: $ANON" \
            --header 'Content-Type: application/json' \
            --data '{"reason":"github-actions-full-btd"}' \
            --output /tmp/btd-cycle.json
          jq '{ok,success_count,failed_count,cache_saved,generated_at_utc}' /tmp/btd-cycle.json
          jq -e '.cache_saved == true and .success_count == 14 and .failed_count == 0' /tmp/btd-cycle.json >/dev/null

      - name: Refresh monetary backdrop
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --max-time 170 \
            --request POST "$BASE/btd-monetary-update" \
            --header "Authorization: Bearer $ANON" \
            --header "apikey: $ANON" \
            --header 'Content-Type: application/json' \
            --data '{"reason":"github-actions-full-btd"}' \
            --output /tmp/btd-monetary.json
          jq '{ok,success_count,failed_count,cache_saved,generated_at_utc}' /tmp/btd-monetary.json
          jq -e '.cache_saved == true and .success_count == 14 and .failed_count == 0' /tmp/btd-monetary.json >/dev/null

      - name: Run BTD scan and persist snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --max-time 120 \
            --request POST "$BASE/btd-scan-and-store" \
            --header "Authorization: Bearer $ANON" \
            --header "apikey: $ANON" \
            --header 'Content-Type: application/json' \
            --data '{"source":"github-actions-full-btd"}' \
            --output /tmp/btd-scan.json
          jq '{ok,status,score_model,weights,run_id,asset_count,success_count,error_count,generated_at_utc,macro_refresh}' /tmp/btd-scan.json
          jq -e '.status == "success" and .score_model == "BTD Core v6" and .weights.historical_rarity == 40 and .asset_count == 14 and .success_count == 14 and .error_count == 0' /tmp/btd-scan.json >/dev/null

      - name: Validate persisted BTD readout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --max-time 120 \
            --request POST "$BASE/btd-score-readout" \
            --header "Authorization: Bearer $ANON" \
            --header "apikey: $ANON" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output /tmp/btd-readout.json
          jq '{ok,score_model,weights,run_id,count,generated_at_utc,health}' /tmp/btd-readout.json
          jq -e '.ok == true and .score_model == "BTD Core v6" and .weights.historical_rarity == 40 and .count == 14 and .health.status == "OK" and .health.success_count == 14 and .health.error_count == 0 and ([.results[].historical_rarity_score] | all(. != null))' /tmp/btd-readout.json >/dev/null
