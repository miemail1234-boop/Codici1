name: ETF drawdown via yfinance

on:
  workflow_dispatch:
  push:
    paths:
      - 'finance-drawdown/**'
      - '.github/workflows/etf-drawdown.yml'
  schedule:
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Calculate drawdown
        run: |
          python finance-drawdown/etf_drawdown_yfinance.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-drawdown-results
          path: |
            finance-drawdown/results/latest_drawdown.json
            finance-drawdown/results/latest_drawdown.csv
            finance-drawdown/results/latest_drawdown.md

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finance-drawdown/results/latest_drawdown.json finance-drawdown/results/latest_drawdown.csv finance-drawdown/results/latest_drawdown.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update ETF drawdown result"
            git push
          fi
